name: Build Advanced NetHunter Kernel (bramble)

# Runs entirely on GitHub's cloud. Produces a flashable AnyKernel zip and
# publishes it as a Release asset (direct download) AND a build artifact.
# Auto-detects the defconfig; if the full feature build fails, it falls back
# to the core config so you still get a working zip.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write   # needed to publish a Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout configs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev libncurses-dev \
            python3 zip unzip wget cpio kmod ccache device-tree-compiler lz4 make

      - name: Fetch Proton-Clang toolchain (single, ~1.5GB)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain
          echo "TC=$PWD/toolchain/bin" >> "$GITHUB_ENV"

      - name: Clone bramble/redbull kernel source (LineageOS, 4.19)
        run: |
          git clone --depth=1 -b lineage-20 https://github.com/LineageOS/android_kernel_google_redbull kernel
          echo "cloned: $(ls -d kernel && cat kernel/Makefile | grep -m3 -E '^VERSION|^PATCHLEVEL|^SUBLEVEL')"

      - name: Detect defconfig
        run: |
          cd kernel
          ls arch/arm64/configs/
          DC=""
          for c in redbull_defconfig vendor/redbull_defconfig vendor/redbull-perf_defconfig \
                   redbull-qgki_defconfig vendor/lineage_redbull_defconfig; do
            [ -f "arch/arm64/configs/$c" ] && DC="$c" && break
          done
          # else first defconfig mentioning redbull/bramble
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs/ | grep -iE 'redbull|bramble' | head -1)
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs/ | grep -i defconfig | head -1)
          echo "Using DEFCONFIG=$DC"
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"

      - name: Build (full feature set, fallback to core)
        run: |
          cd kernel
          export PATH="$TC:$PATH"
          MK="make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CLANG_TRIPLE=aarch64-linux-gnu-"
          build_with() {
            rm -rf out
            $MK "$DEFCONFIG"
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config "$@"
            $MK olddefconfig
            $MK || return 1
          }
          echo "::group::Attempt 1 - FULL feature set"
          if build_with ../config/nethunter_extra.config ../config/nethunter_extra_plus.config ../config/nethunter_extra_ultra.config; then
            echo "FULL build OK"; echo "TIER=full" >> "$GITHUB_ENV"
          else
            echo "::endgroup::"; echo "::group::Attempt 2 - CORE config fallback"
            if build_with ../config/nethunter_extra.config; then
              echo "CORE build OK"; echo "TIER=core" >> "$GITHUB_ENV"
            else
              echo "::endgroup::"; echo "::group::Attempt 3 - stock defconfig"
              rm -rf out; $MK "$DEFCONFIG"; $MK; echo "TIER=stock" >> "$GITHUB_ENV"
            fi
          fi
          echo "::endgroup::"
          ls -la out/arch/arm64/boot/ || true

      - name: Package with AnyKernel3 (bramble)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          IMG="$(ls kernel/out/arch/arm64/boot/Image.lz4-dtb kernel/out/arch/arm64/boot/Image.gz-dtb kernel/out/arch/arm64/boot/Image-dtb kernel/out/arch/arm64/boot/Image.gz kernel/out/arch/arm64/boot/Image 2>/dev/null | head -1)"
          echo "kernel image: $IMG"
          test -n "$IMG"
          cp "$IMG" ak3/
          cd ak3
          cat > anykernel.sh <<'AK'
          properties() { '
          kernel.string=Advanced NetHunter Pixel 4a 5G (bramble)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=bramble
          supported.versions=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AK
          zip -r9 "../Alynx-Advanced-Nethunter-${TIER:-build}.zip" . -x '.git*'
          cd ..
          ls -la Alynx-Advanced-Nethunter-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alynx-Advanced-Nethunter
          path: Alynx-Advanced-Nethunter-*.zip
          if-no-files-found: error

      - name: Publish Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Advanced NetHunter kernel (bramble) build ${{ github.run_number }}
          files: Alynx-Advanced-Nethunter-*.zip
          body: |
            Flashable AnyKernel zip for Pixel 4a 5G (bramble).
            Tier built: ${{ env.TIER }}
            Flash via Franco Kernel Manager, then install the FULL Kali chroot.
