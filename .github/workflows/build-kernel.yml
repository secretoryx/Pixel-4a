name: Build Advanced NetHunter Kernel (sunfish)

# Pixel 4a (sunfish), kernel 4.14, Android 13.
# Source: V3rB0se/Alynx-nethunter-sunfish (alynx_android-13.0.0_r0.17).
# Produces a flashable AnyKernel zip, published as a Release (direct download).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout configs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev libncurses-dev \
            python3 zip unzip wget cpio kmod ccache device-tree-compiler lz4 make

      - name: Fetch Proton-Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain
          echo "TC=$PWD/toolchain/bin" >> "$GITHUB_ENV"

      - name: Clone sunfish NetHunter kernel source (Alynx, 4.14, A13)
        run: |
          git clone --depth=1 -b alynx_android-13.0.0_r0.17 https://github.com/V3rB0se/Alynx-nethunter-sunfish kernel
          echo "cloned:"; ( cd kernel && head -3 Makefile )

      - name: Detect defconfig
        run: |
          cd kernel
          ls arch/arm64/configs/
          DC=""
          for c in sunfish_defconfig vendor/sunfish-perf_defconfig vendor/sunfish_defconfig \
                   b4s4_defconfig vendor/lineage_sunfish_defconfig vendor/alynx_defconfig; do
            [ -f "arch/arm64/configs/$c" ] && DC="$c" && break
          done
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs/ | grep -iE 'sunfish|b4s4|alynx|nethunter' | head -1)
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs/ | grep -i defconfig | head -1)
          echo "Using DEFCONFIG=$DC"
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"

      - name: Build (full -> core -> stock fallback)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          cd kernel
          export PATH="$TC:$PATH"
          # tolerate flag/version mismatch between this clang and a 4.14 tree
          export KCFLAGS="-Wno-unknown-warning-option -Wno-error"
          export KCPPFLAGS="-Wno-unknown-warning-option -Wno-error"
          clang --version | head -1 || true
          # Hard-disable the 32-bit compat vDSO block (clang-13 can't assemble it; harmless).
          sed -i 's|ifeq ($(CONFIG_COMPAT_VDSO), y)|ifeq (vdso32_disabled,y)|' arch/arm64/Makefile
          grep -n "vdso32_disabled\|CONFIG_COMPAT_VDSO" arch/arm64/Makefile | head
          # (mkcompile_h's LINUX_COMPILER is fixed below by passing KBUILD_COMPILER_STRING
          #  as a make command-line var, which make force-exports to mkcompile_h.)
          echo ">>> DEFCONFIG=$DEFCONFIG"
          # 4.14 builds with clang + GNU binutils (no LLVM=1)
          # 32-bit compat vDSO: clang uses -no-integrated-as and finds the external arm
          # assembler via `which $(CROSS_COMPILE_ARM32)ld`. Use an ABSOLUTE path to Ubuntu's
          # GNU arm toolchain so it doesn't grab Proton-Clang's broken one off PATH.
          which arm-linux-gnueabi-as arm-linux-gnueabi-ld /usr/bin/arm-linux-gnueabi-as || true
          MK="make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=/usr/bin/arm-linux-gnueabi- \
              KBUILD_COMPILER_STRING=ProtonClang13"
          build_with() {
            rm -rf out
            $MK "$DEFCONFIG"
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config "$@"
            $MK olddefconfig
            $MK || return 1
          }
          echo "::group::FULL"; if build_with ../config/nethunter_extra.config ../config/nethunter_extra_plus.config ../config/nethunter_extra_ultra.config; then
            echo "FULL OK"; echo "TIER=full" >> "$GITHUB_ENV"
          else echo "::endgroup::"; echo "::group::CORE"; if build_with ../config/nethunter_extra.config; then
            echo "CORE OK"; echo "TIER=core" >> "$GITHUB_ENV"
          else echo "::endgroup::"; echo "::group::STOCK"; rm -rf out; $MK "$DEFCONFIG"; $MK; echo "TIER=stock" >> "$GITHUB_ENV"
          fi; fi
          echo "::endgroup::"
          ls -la out/arch/arm64/boot/ || true

      - name: Package with AnyKernel3 (sunfish)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          IMG="$(ls kernel/out/arch/arm64/boot/Image.lz4-dtb kernel/out/arch/arm64/boot/Image.gz-dtb kernel/out/arch/arm64/boot/Image-dtb kernel/out/arch/arm64/boot/Image.gz kernel/out/arch/arm64/boot/Image 2>/dev/null | head -1)"
          echo "kernel image: $IMG"; test -n "$IMG"; cp "$IMG" ak3/
          cd ak3
          cat > anykernel.sh <<'AK'
          properties() { '
          kernel.string=Advanced NetHunter Pixel 4a (sunfish)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sunfish
          supported.versions=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AK
          zip -r9 "../NetHunter-Sunfish-${TIER:-build}.zip" . -x '.git*'
          cd ..; ls -la NetHunter-Sunfish-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Sunfish
          path: NetHunter-Sunfish-*.zip
          if-no-files-found: error

      - name: Publish Release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sunfish-${{ github.run_number }}
          name: Advanced NetHunter kernel (Pixel 4a / sunfish) build ${{ github.run_number }}
          files: NetHunter-Sunfish-*.zip
          body: |
            Flashable AnyKernel zip for Pixel 4a (sunfish), Android 13.
            Tier built: ${{ env.TIER }}
            Flash via Franco Kernel Manager, then install the FULL Kali chroot.

      - name: Publish ERROR LOG on failure
        if: failure()
        run: |
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/build-full.log" 2>/dev/null || true
          {
            echo "DEFCONFIG=${DEFCONFIG:-unknown}"
            echo "=== real compile errors (full log) ==="
            grep -nE "error:|Error [0-9]|undefined reference|No rule to make|ld\.lld:|multiple definition" "$GITHUB_WORKSPACE/build.log" 2>/dev/null | grep -viE "note:|warning:" | tail -150
            echo "=== last 150 lines ==="
            tail -n 150 "$GITHUB_WORKSPACE/build.log" 2>/dev/null
          } > "$GITHUB_WORKSPACE/build-error.txt" || echo none > "$GITHUB_WORKSPACE/build-error.txt"

      - name: Release error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: errorlog-${{ github.run_number }}
          name: BUILD ERROR LOG ${{ github.run_number }}
          files: |
            build-error.txt
            build-full.log
          body: sunfish build error log (full)
