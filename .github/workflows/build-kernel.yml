name: Build Advanced NetHunter Kernel (sunfish)

# Pixel 4a (sunfish), kernel 4.14, Android 13.
# Source: V3rB0se/Alynx-nethunter-sunfish (alynx_android-13.0.0_r0.17).
# Produces a flashable AnyKernel zip, published as a Release (direct download).

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout configs
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev libncurses-dev \
            python3 zip unzip wget cpio kmod ccache device-tree-compiler lz4 make

      - name: Free disk space + add big swap on /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
                      /usr/lib/jvm /usr/local/.ghcup /usr/local/graalvm \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          sudo apt-get clean
          # Put swap on /mnt (the big ~70 GB ephemeral disk), NOT on / (small — the build tree,
          # toolchain and out/ all live on / and must not compete with swap for space).
          # 24 GB swap + 7 GB RAM = ~31 GB: enough to absorb even a heavy single-threaded lld link.
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && \
            sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile || true
          echo "=== swap ==="; swapon --show; free -h
          echo "=== disk / ==="; df -h /
          echo "=== disk /mnt ==="; df -h /mnt

      - name: Fetch Proton-Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain
          echo "TC=$PWD/toolchain/bin" >> "$GITHUB_ENV"

      - name: Clone sunfish NetHunter kernel source (Alynx, 4.14, A13)
        run: |
          git clone --depth=1 -b alynx_android-13.0.0_r0.17 https://github.com/V3rB0se/Alynx-nethunter-sunfish kernel
          echo "cloned:"; ( cd kernel && head -3 Makefile )

      - name: Detect defconfig
        run: |
          cd kernel
          ls arch/arm64/configs/
          # nethunter_defconfig FIRST: it is the complete, maintainer-tested config the flashed
          # Alynx kernel was built from, and it ALREADY has MAC80211 + every external USB Wi-Fi
          # injection driver (ath9k_htc, carl9170, rt2800usb, rtl8187, mt7601u, zd1211rw, ...).
          # No fragment merge needed. sunfish_defconfig is only a stripped-down fallback.
          DC=""
          for c in nethunter_defconfig sunfish_defconfig vendor/sunfish-perf_defconfig \
                   vendor/sunfish_defconfig b4s4_defconfig vendor/lineage_sunfish_defconfig; do
            [ -f "arch/arm64/configs/$c" ] && DC="$c" && break
          done
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs/ | grep -iE 'nethunter|sunfish|b4s4|alynx' | head -1)
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs/ | grep -i defconfig | head -1)
          echo "Using DEFCONFIG=$DC"
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"

      - name: Build (full -> core -> stock fallback)
        run: |
          # Log DIRECTLY to a file on the big /mnt disk. A direct `> file` redirect writes
          # incrementally, so the log SURVIVES a failed/killed step (the old `tail -n N > file`
          # buffered everything in RAM and wrote nothing if the process was killed -> empty logs).
          # /mnt has ~70 GB, so the GBs of qcacld warnings can't fill the small / partition.
          # /mnt is root-owned, so make a world-writable subdir there for the log (big disk).
          # Fall back to the workspace (on /) if /mnt can't be used.
          sudo mkdir -p /mnt/bl && sudo chmod 1777 /mnt/bl || true
          if ( : > /mnt/bl/build.log ) 2>/dev/null; then BUILD_LOG=/mnt/bl/build.log; else BUILD_LOG="$GITHUB_WORKSPACE/build.log"; fi
          echo "logging full build output to $BUILD_LOG"
          echo "BUILD_LOG=$BUILD_LOG" >> "$GITHUB_ENV"
          exec > "$BUILD_LOG" 2>&1
          cd kernel
          export PATH="$TC:$PATH"
          # Big swap (24 GB on /mnt) now absorbs peak RAM, so run at full parallelism for speed.
          JOBS=$(nproc)
          # tolerate flag/version mismatch between this clang and a 4.14 tree
          export KCFLAGS="-Wno-unknown-warning-option -Wno-error"
          export KCPPFLAGS="-Wno-unknown-warning-option -Wno-error"
          clang --version | head -1 || true
          # Hard-disable the 32-bit compat vDSO block (clang-13 can't assemble it; harmless).
          sed -i 's|ifeq ($(CONFIG_COMPAT_VDSO), y)|ifeq (vdso32_disabled,y)|' arch/arm64/Makefile
          grep -n "vdso32_disabled\|CONFIG_COMPAT_VDSO" arch/arm64/Makefile | head
          # (mkcompile_h's LINUX_COMPILER is fixed below by passing KBUILD_COMPILER_STRING
          #  as a make command-line var, which make force-exports to mkcompile_h.)
          echo ">>> DEFCONFIG=$DEFCONFIG"
          # 4.14 builds with clang + GNU binutils (no LLVM=1)
          # 32-bit compat vDSO: clang uses -no-integrated-as and finds the external arm
          # assembler via `which $(CROSS_COMPILE_ARM32)ld`. Use an ABSOLUTE path to Ubuntu's
          # GNU arm toolchain so it doesn't grab Proton-Clang's broken one off PATH.
          which arm-linux-gnueabi-as arm-linux-gnueabi-ld /usr/bin/arm-linux-gnueabi-as || true
          # Link with LLVM lld (ships in Proton-Clang): Proton's ld.gold has a broken
          # hardcoded /root/build path, and the GNU bfd cross-ld isn't present on the runner.
          MK="make -j${JOBS} O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=/usr/bin/arm-linux-gnueabi- \
              LD=ld.lld KBUILD_COMPILER_STRING=ProtonClang13"
          # Link fix: drv2624.c defines `inline void hap_ignore_next_request()` (non-static inline),
          # which may NOT emit an external symbol under clang, so the built-in fpc1020 fingerprint
          # driver fails to link against it (ld.lld: undefined symbol: hap_ignore_next_request).
          # Drop the `inline` so the definition always has external linkage.
          sed -i 's/^[[:space:]]*inline void hap_ignore_next_request/void hap_ignore_next_request/' \
            drivers/input/misc/drv2624.c || true
          grep -n "hap_ignore_next_request" drivers/input/misc/drv2624.c | head
          # Build ONLY nethunter_defconfig (the complete, correct config). No sunfish fallback:
          # sunfish has DRV2624=m, which can NEVER resolve the above symbol, and its `rm -rf out`
          # would also destroy the real build output.
          echo "::group::BUILD $DEFCONFIG"
          rm -rf out
          $MK "$DEFCONFIG"
          $MK
          echo "::endgroup::"
          echo "TIER=$DEFCONFIG" >> "$GITHUB_ENV"
          echo "=== boot dir ==="; ls -la out/arch/arm64/boot/ || true
          # Hard assert: a kernel image must exist, else fail the step cleanly (so Package is skipped).
          if ! ls out/arch/arm64/boot/Image* >/dev/null 2>&1; then
            echo "!! BUILD PRODUCED NO IMAGE"; exit 1
          fi

      - name: Package with AnyKernel3 (sunfish)
        run: |
          # Capture EVERYTHING this step does (with -x trace) to pkg.log, which a later step
          # commits to the ci-logs branch so it is readable via raw.githubusercontent (no auth).
          exec > >(tee "$GITHUB_WORKSPACE/pkg.log") 2>&1
          set -x
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3 || true
          BOOT=kernel/out/arch/arm64/boot
          echo "=== full boot dir listing ==="; ls -la "$BOOT" || true
          # Pick the kernel image. NOTE: steps run with `set -e`, so a bare `[ -f x ] && ...`
          # that is false would ABORT the step — use if-blocks, which errexit never trips on.
          IMG=""
          for cand in Image.gz-dtb Image.lz4-dtb Image-dtb Image.gz Image.lz4 Image; do
            if [ -f "$BOOT/$cand" ]; then IMG="$BOOT/$cand"; break; fi
          done
          if [ -z "$IMG" ]; then IMG="$(ls "$BOOT"/Image* 2>/dev/null | head -1)"; fi
          echo "selected kernel image: $IMG"
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "!! no kernel Image produced — build output missing"; ls -laR "$BOOT" || true; exit 1
          fi
          # Safety net: also stash the raw image so it can be published even if zip packaging trips.
          cp "$IMG" "$GITHUB_WORKSPACE/$(basename "$IMG")"
          cp "$IMG" ak3/
          cd ak3
          cat > anykernel.sh <<'AK'
          properties() { '
          kernel.string=Advanced NetHunter Pixel 4a (sunfish)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sunfish
          supported.versions=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AK
          zip -r9 "../NetHunter-Sunfish-${TIER:-build}.zip" . -x '.git*'
          cd ..; ls -la NetHunter-Sunfish-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Sunfish
          path: NetHunter-Sunfish-*.zip
          if-no-files-found: error

      - name: Publish Release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sunfish-${{ github.run_number }}
          name: Advanced NetHunter kernel (Pixel 4a / sunfish) build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            NetHunter-Sunfish-*.zip
            Image*
          body: |
            Flashable AnyKernel zip for Pixel 4a (sunfish), Android 13.
            Config: ${{ env.TIER }}  (already contains MAC80211 + all USB Wi-Fi injection drivers)
            Flash the .zip via Franco Kernel Manager. The raw Image* is a fallback.

      - name: Publish ERROR LOG on failure
        if: failure()
        run: |
          # Always produce both files (even empty) so neither the artifact nor the release
          # upload can fail on a missing file.
          BL="${BUILD_LOG:-/mnt/build.log}"
          cp "$BL" "$GITHUB_WORKSPACE/build-full.log" 2>/dev/null || true
          [ -f "$GITHUB_WORKSPACE/build-full.log" ] || : > "$GITHUB_WORKSPACE/build-full.log"
          {
            echo "DEFCONFIG=${DEFCONFIG:-unknown}"
            echo "=== real compile errors (full log) ==="
            grep -nE "error:|Error [0-9]|undefined reference|No rule to make|ld\.lld:|multiple definition|recipe for target" "$BL" 2>/dev/null | grep -viE "note:|warning:" | tail -200
            echo "=== last 200 lines ==="
            tail -n 200 "$BL" 2>/dev/null
          } > "$GITHUB_WORKSPACE/build-error.txt" || echo none > "$GITHUB_WORKSPACE/build-error.txt"
          echo "----- error head (also on console) -----"; head -60 "$GITHUB_WORKSPACE/build-error.txt"

      - name: Upload error log as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: |
            build-error.txt
            build-full.log
          if-no-files-found: ignore

      - name: Release error log
        if: failure()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: errorlog-${{ github.run_number }}
          name: BUILD ERROR LOG ${{ github.run_number }}
          fail_on_unmatched_files: false
          make_latest: false
          files: |
            build-error.txt
            build-full.log
          body: sunfish build error log (full)

      - name: Publish logs to ci-logs branch (readable via raw, no auth)
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          BL="${BUILD_LOG:-/mnt/build.log}"
          mkdir -p /tmp/lg
          cp pkg.log       /tmp/lg/pkg-${{ github.run_number }}.log   2>/dev/null || echo "no pkg.log" > /tmp/lg/pkg-${{ github.run_number }}.log
          tail -n 400 "$BL" > /tmp/lg/build-tail-${{ github.run_number }}.log 2>/dev/null || echo "no build log at $BL" > /tmp/lg/build-tail-${{ github.run_number }}.log
          grep -nE "error:|ld\.lld: error|undefined symbol|Error [0-9]|recipe for target|No rule to make" "$BL" 2>/dev/null \
            | grep -viE "warning:|note:" | tail -120 > /tmp/lg/errors-${{ github.run_number }}.log 2>/dev/null || true
          git config user.email actions@github.com
          git config user.name ci
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p ci-logs
          cp /tmp/lg/* ci-logs/ 2>/dev/null || true
          git add -f ci-logs
          git commit -m "ci logs run ${{ github.run_number }}" || true
          git push -f origin ci-logs
